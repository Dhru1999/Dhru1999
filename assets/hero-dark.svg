<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="Dhrupti Pambhar. From production backends to pipelines and models: a learning log, kept in public. C#/.NET engineer, Surat to Hamburg, exploring data and AI.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151b23"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4493f8"/><stop offset=".5" stop-color="#ab7df8"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#3d444d" opacity=".55"/></pattern>
</defs>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;} .turn{opacity:0;animation:turn 12.8s infinite;} @keyframes turn{0%{opacity:0;transform:translateY(10px)} 3.0%{opacity:1;transform:translateY(0)} 21.2%{opacity:1;transform:translateY(0)} 24.2%{opacity:0;transform:translateY(-8px)} 100%{opacity:0}} .caret{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}} .rise{opacity:0;animation:rise .8s ease-out forwards} @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} @media (prefers-reduced-motion: reduce){.turn{animation:none} .turn.first{opacity:1} .caret,.rise{animation:none;opacity:1} .anim{display:none}}</style>
<rect x="1" y="1" width="918" height="328" rx="18" fill="url(#bg)" stroke="#3d444d"/>
<rect x="1" y="1" width="918" height="328" rx="18" fill="url(#dots)"/>
<text class="mono rise" x="44" y="52" font-size="13" fill="#9198a1"><tspan fill="#3fb950">~/dhrupti</tspan> $ git log --since=2017 --oneline</text>
<text class="rise" style="animation-delay:.15s" x="42" y="112" font-size="54" font-weight="800" letter-spacing="-1" fill="url(#name)">Dhrupti Pambhar</text>
<text x="44" y="158" font-size="24" font-weight="600" fill="#e6edf3">I turn</text>
<text class="turn first" style="animation-delay:0.0s" x="122" y="158" font-size="24" font-weight="600"><tspan fill="#9198a1">slow queries</tspan><tspan fill="#9198a1"> → </tspan><tspan fill="#d29922">fast ones</tspan><tspan class="caret" fill="#d29922" font-weight="300"> |</tspan></text>
<text class="turn" style="animation-delay:3.2s" x="122" y="158" font-size="24" font-weight="600"><tspan fill="#9198a1">messy data</tspan><tspan fill="#9198a1"> → </tspan><tspan fill="#3fb950">honest pipelines</tspan><tspan class="caret" fill="#3fb950" font-weight="300"> |</tspan></text>
<text class="turn" style="animation-delay:6.4s" x="122" y="158" font-size="24" font-weight="600"><tspan fill="#9198a1">notebooks</tspan><tspan fill="#9198a1"> → </tspan><tspan fill="#4493f8">tested code</tspan><tspan class="caret" fill="#4493f8" font-weight="300"> |</tspan></text>
<text class="turn" style="animation-delay:9.600000000000001s" x="122" y="158" font-size="24" font-weight="600"><tspan fill="#9198a1">data</tspan><tspan fill="#9198a1"> → </tspan><tspan fill="#ab7df8">models</tspan><tspan class="caret" fill="#ab7df8" font-weight="300"> |</tspan></text>
<text class="rise" style="animation-delay:.35s" x="44" y="192" font-size="15" fill="#9198a1">From production backends to pipelines and models: a learning log, kept in public.</text>
<g class="rise" style="animation-delay:.5s"><rect x="44" y="212" width="167" height="50" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="58" y="235" font-size="18" font-weight="800" fill="#d29922">2+ yrs</text><text x="58" y="252" font-size="11.5" fill="#9198a1">C#/.NET in production</text></g>
<g class="rise" style="animation-delay:.5s"><rect x="221" y="212" width="127" height="50" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="235" y="235" font-size="18" font-weight="800" fill="#d29922">10+ GB</text><text x="235" y="252" font-size="11.5" fill="#9198a1">documents a day</text></g>
<g class="rise" style="animation-delay:.5s"><rect x="358" y="212" width="134" height="50" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="372" y="235" font-size="18" font-weight="800" fill="#3fb950">384,908</text><text x="372" y="252" font-size="11.5" fill="#9198a1">buildings mapped</text></g>
<g class="rise" style="animation-delay:.5s"><rect x="501" y="212" width="108" height="50" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="515" y="235" font-size="18" font-weight="800" fill="#ab7df8">R² 0.88</text><text x="515" y="252" font-size="11.5" fill="#9198a1">first model</text></g>
<path d="M70 296 H330" stroke="#4493f8" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
<text x="200" y="301" text-anchor="middle" font-size="15" fill="#6e7681">&#9992;</text>
<path d="M330 296 H560" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
<path d="M560 296 H600" stroke="#ab7df8" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity=".7"/>
<circle class="anim" r="4" fill="#e6edf3"><animateMotion dur="7s" repeatCount="indefinite" path="M70 296 H600"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="70" cy="296" r="7" fill="#0d1117" stroke="#4493f8" stroke-width="3.5"/>
<text x="84" y="286" font-size="12" font-weight="600" fill="#e6edf3">Surat</text>
<circle cx="330" cy="296" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="3.5"/>
<text x="344" y="286" font-size="12" font-weight="600" fill="#e6edf3">Hamburg</text>
<circle class="anim" cx="560" cy="296" r="7" fill="none" stroke="#ab7df8" stroke-width="2"><animate attributeName="r" values="7;16" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="296" r="7" fill="#ab7df8"/>
<text x="574" y="286" font-size="12" font-weight="600" fill="#e6edf3">now: data &amp; AI</text>
<text x="880" y="300" text-anchor="end" font-size="12.5" fill="#9198a1">C#/.NET engineer · exploring data &amp; AI</text>
</svg>